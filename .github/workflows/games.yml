name: Game tests

# Plays every level of every game, both themes and languages (full mode, 4 tests at a time). Runs once a week and on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  games:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Play every game
        run: PORT=5220 npm test -- --jobs 4 --retry 1
      - name: Keep the test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: tools/.logs
